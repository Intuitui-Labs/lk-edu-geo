name: CI Quality Gate

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  verify:
    name: Verify Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm run check-types
      - run: pnpm run test:coverage
      - run: pnpm run build

      # Guards the published ESM artifact against defects that only appear once
      # dist/ is loaded by a real Node runtime (e.g. missing JSON import
      # attributes). Source-level tests run through Vite and cannot catch these.
      - run: pnpm run test:artifact
